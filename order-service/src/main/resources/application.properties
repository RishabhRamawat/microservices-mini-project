spring.application.name=order-service

# ─── Server Configuration ──────────────────────────────────────────────────────
# Run Order Service on port 8081 to avoid local port collision with other services.
server.port=8081

# ─── MySQL DataSource ──────────────────────────────────────────────────────────
# Connects to isolated order_service schema for database-per-service isolation
spring.datasource.url=jdbc:mysql://localhost:3306/order_service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Eureka Client Configuration ──────────────────────────────────────────────
# Connect to Eureka server for service registration and discovery.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

