spring.application.name=authentication-service
server.port=8083

# ─── MySQL DataSource ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── JWT ──────────────────────────────────────────────────────────────────────
# jwt.secret must be a Base64-encoded string of at least 256 bits (32 bytes)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# ─── CORS ─────────────────────────────────────────────────────────────────────
# Comma-separated origins; defaults to wildcard for development convenience
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.max-age=${CORS_MAX_AGE:3600}
//logging.level.org.springframework.security=DEBUG

# ─── Eureka Client Configuration ──────────────────────────────────────────────
# Connect to Eureka server for service registration and discovery.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/