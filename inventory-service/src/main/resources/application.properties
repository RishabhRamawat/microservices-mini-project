spring.application.name=inventory-service
server.port=8082

# ─── MySQL DataSource ──────────────────────────────────────────────────────────
# Connects to isolated inventory_service schema for database-per-service isolation
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Eureka Client Configuration ──────────────────────────────────────────────
# Connect to Eureka server for service registration and discovery.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

